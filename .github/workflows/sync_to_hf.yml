name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://henesduran:$HF_TOKEN@huggingface.co/spaces/henesduran/gui-instruction-pipeline
          git push --force space master